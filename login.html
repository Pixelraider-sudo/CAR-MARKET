<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <div id="login">
        <div id="navbar">
            <nav>
                <a href="index.html">Home</a>
                <a href="brands.html">Brands</a>
                <a href="register.html">Register</a>
                <a href="login.html">Login</a>
                <a href="contact.html">Contact</a>
                <img src="drive your dream.jpg" alt="Brand Logo" length="100" width="100">
            </nav>
        </div>
        <div id="welcome">
            <h1>Welcome Back!</h1>
            <p>Please enter your credentials to access your account and continue your journey with us.</p>
        </div>
        <div id="login-form">
            <h1>Login</h1>
            <form action="login.html" method="post">
                <label for="img"><img src="Logos.jpg" alt="logos"></label><br><br>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required><br><br>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required><br><br>
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember Me</label><br><br>
                <button type="submit">Login</button><br><br>
                <p>Don't have an account<a href="register.html">register</a></p>
            </form>
        </div>
         <div id="footer">
            <p>&copy; 2026 Drive your Dream Today. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
