<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="register.css">
    <title>Register</title>
</head>
<body>
    <div id="reg-back">
        <video autoplay muted loop playsinline >
            <source src="AMG-REG.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
    </div>
    <div id="login">
        <div id="navbar">
            <nav>
                <a href="index.html">Home</a>
                <a href="brands.html">Brands</a>
                <a href="register.html">Register</a>
                <a href="login.html">Login</a>
                <a href="contact.html">Contact</a>
                <img src="drive your dream.jpg" alt="Brand Logo" length="100" width="100">
            </nav>
        </div>
       <div id="collaboration">
            <h1>Glad for your collaboration</h1>
            <p>Please enter your credentials to access your account and continue your journey with us.</p>
        </div>
       </div>
        <div id="register-form">
            <h1>Register</h1>
            <form action="register.html" method="post">
                <label for="img"><img src="Logos.jpg" alt="logos"></label><br><br>
                <label for="Firstname">Firstname:</label>
                <input type="text" id="firstname" name="firstname" required><br><br>
                <label for="Lastname">Lastname:</label>
                <input type="text" id="lastname" name="lastname" required><br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>
                <label for="phonenumber">Phone Number:</label>
                <input type="text" id="phonenumber" name="phonenumber" required><br><br>
                <label for="username">Username:</label> 
                <input type="text" id="username" name="username" required><br><br>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required><br><br>
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" required><br><br>
                <label for="dl">DRIVING LICENSE:</label>
                <input type="file" id="dl" name="dl" accept=".jpg, .jpeg, .png" required><br><br>
                <button type="submit">Register</button><br><br>               
                <p>Don't have an account <a href="login.html">Login</a></p>
            </form>
        </div>
    <div>
            <div id="footer">
                <p>&copy; 2024 Drive Your Dream. All rights reserved.</p>
            </div>
    </div>
</body>
</html>
